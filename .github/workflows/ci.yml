# CI 워크플로우
# - main/develop 브랜치 push 시 실행
# - PR 생성/업데이트 시 실행

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # 백엔드 테스트
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build --if-present

      - name: Run tests
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: github.event_name == 'push'
        with:
          files: apps/backend/coverage/lcov.info
          fail_ci_if_error: false

  # 문서 검증 (스펙 파일 존재 여부)
  docs-check:
    name: Docs Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check essential docs
        run: |
          echo "Checking essential documentation..."

          # 필수 문서 체크
          required_files=(
            "AGENTS.md"
            "CLAUDE.md"
            "README.md"
          )

          missing=0
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              missing=1
            else
              echo "✅ Found: $file"
            fi
          done

          if [ $missing -eq 1 ]; then
            echo "::warning::Some essential docs are missing"
          fi

      - name: Check agent definitions
        run: |
          echo "Checking agent definitions..."
          agent_count=$(find .claude/agents -name "*.md" 2>/dev/null | wc -l)
          echo "Found $agent_count agent definition(s)"

          if [ "$agent_count" -eq 0 ]; then
            echo "::warning::No agent definitions found in .claude/agents/"
          fi

  # 전체 결과
  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    needs: [backend-test, docs-check]
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.backend-test.result }}" == "failure" ]; then
            echo "Backend tests failed"
            exit 1
          fi
          echo "✅ All checks passed"
