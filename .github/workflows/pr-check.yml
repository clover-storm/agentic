# PR 체크 워크플로우
# - PR 생성/업데이트 시 자동 라벨링 및 체크

name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  # PR 제목 형식 체크
  title-check:
    name: PR Title Check
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title format
        run: |
          TITLE="${{ github.event.pull_request.title }}"

          # Conventional Commits 형식 체크
          # feat: / fix: / chore: / docs: / refactor: / test:
          if [[ ! "$TITLE" =~ ^(feat|fix|chore|docs|refactor|test|style|perf|ci|build|revert)(\(.+\))?: ]]; then
            echo "❌ PR title should follow Conventional Commits format"
            echo "Examples:"
            echo "  feat: add new feature"
            echo "  fix: resolve bug"
            echo "  chore: update dependencies"
            exit 1
          fi

          echo "✅ PR title format is valid"

  # 변경 파일 기반 라벨링
  labeler:
    name: Auto Labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Label by files changed
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const labels = new Set();

            for (const file of files) {
              const path = file.filename;

              if (path.startsWith('.claude/agents/')) labels.add('agent');
              if (path.startsWith('.claude/skills/')) labels.add('skill');
              if (path.startsWith('.claude/commands/')) labels.add('command');
              if (path.startsWith('specs/')) labels.add('spec');
              if (path.startsWith('apps/backend/')) labels.add('backend');
              if (path.startsWith('apps/frontend/')) labels.add('frontend');
              if (path.endsWith('.md')) labels.add('documentation');
              if (path.includes('test')) labels.add('test');
            }

            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [...labels]
              });
              console.log('Added labels:', [...labels]);
            }

  # 스펙 문서 체크
  spec-check:
    name: Spec Document Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for spec updates
        run: |
          # PR에서 변경된 파일 목록
          echo "Checking if code changes have corresponding spec updates..."

          # 코드 변경이 있으면 스펙 문서도 있어야 함 (권장)
          if git diff --name-only origin/main | grep -q "^apps/"; then
            if ! git diff --name-only origin/main | grep -q "^specs/"; then
              echo "::warning::Code changes detected but no spec updates. Consider updating specs/"
            else
              echo "✅ Spec documents are updated"
            fi
          fi
